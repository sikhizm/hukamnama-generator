 the teachings of the Vedas and the Puraanas, I wanted to perform the religious rituals.","But seeing all the wise men caught by Death, I arose and left the Pandits; now I am free of this desire.\u00a0||1||","O mind, you have not completed the only task you were given;","you have not meditated on the Lord, your King.\u00a0||1||Pause||","Going to the forests, they practice Yoga and deep, austere meditation; they live on roots and the fruits they gather.","The musicians, the Vedic scholars, the chanters of one word and the men of silence, all are listed on the Register of Death.\u00a0||2||","Loving devotional worship does not enter into your heart; pampering and adorning your body, you must still give it up.","You sit and play music, but you are still a hypocrite; what do you expect to receive from the Lord?\u00a0||3||","Death has fallen on the whole world; the doubting religious scholars are also listed on the Register of Death.","Says Kabeer, those humble people become pure - they become Khalsa - who know the Lord\u0027s loving devotional worship.\u00a0||4||3||"],"spanish":["Escuchando los Vedas y los Puranas, tambi\u00e9n pens\u00e9 en ir por el camino de las buenas acciones,","pero viendo que los eruditos son atrapados por la muerte, me alej\u00e9 de ellos lleno de consternaci\u00f3n. (1)","Oh mente, tu tarea m\u00e1s importante contin\u00faa sin realizarse,","pues no has habitado en tu Dios. (1\u2011Pausa)","Te fuiste a los bosques para practicar Yoga y austeridades, te alimentaste de ra\u00edces, pero siendo un Yogui,","un seguidor de los Vedas, uno hombre en silencio o de una sola palabra, no has sido liberado del lazo de la muerte. (2)","No permitiste en ti la amorosa adoraci\u00f3n de Dios. Preocup\u00e1ndote por los s\u00edmbolos,","le entregaste tu cuerpo a la muerte. Aqu\u00e9l que nada m\u00e1s finge tener una experiencia espiritual, \u00bfc\u00f3mo puede \u00e9l apegarse a Dios? (3)","El mundo entero est\u00e1 determinado por la condici\u00f3n de ser mortal. Los escolares religiosos tambi\u00e9n est\u00e1n registrados en la bit\u00e1cora de la muerte.","Dice Kabir, los humildes que purifican su ser y se vuelven Kjalsa, sienten la Devoci\u00f3n en la Alabanza Amorosa al Se\u00f1or. (4\u20113)"],"hindi":["byd purwn sBY mq suin kY krI krm kI Awsw ]","kwl gRsq sB log isAwny auiT pMifq pY cly inrwsw ]1]","mn ry sirE n eykY kwjw ]","BijE n rGupiq rwjw ]1] rhwau ]","bn KMf jwie jogu qpu kIno kMd mUlu cuin KwieAw ]","nwdI bydI sbdI monI jm ky ptY ilKwieAw ]2]","Bgiq nwrdI irdY n AweI kwiC kUiC qnu dInw ]","rwg rwgnI ifMB hoie bYTw auin hir pih ikAw lInw ]3]","pirE kwlu sBY jg aUpr mwih ilKy BRm igAwnI ]","khu kbIr jn Bey Kwlsy pRym Bgiq ijh jwnI ]4]3]"],"lareevaar":["bydpurwnsBYmqsuinkYkrIkrmkIAwsw]","kwlgRsqsBlogisAwnyauiTpMifqpYclyinrwsw]1]","mnrysirEneykYkwjw]","BijEnrGupiqrwjw]1]rhwau]","bnKMfjwiejoguqpukInokMdmUlucuinKwieAw]","nwdIbydIsbdImonIjmkyptYilKwieAw]2]","BgiqnwrdIirdYnAweIkwiCkUiCqnudInw]","rwgrwgnIifMBhoiebYTwauinhirpihikAwlInw]3]","pirEkwlusBYjgaUprmwihilKyBRmigAwnI]","khukbIrjnBeyKwlsypRymBgiqijhjwnI]4]3]"],"punjabi":["ijnHW isAwxy bMidAW ny vyd purwn AwidkW dy swry mq sux ky krm-kWf dI Aws r`KI, (ieh Aws r`KI ik krm-kWf nwl jIvn sOrygw), auh swry (Awqmk) mOq ivc hI gRsy rhy\u00a0[","pMifq lok BI Aws pUrI hox qoN ibnw hI au`T ky cly gey (jgq iqAwg gey)\u00a0[1[","hy mn! qUM pRkwS-rUp prmwqmw dw Bjn nhIN kIqw, qYQoN ieh ie`k kMm BI (jo krn-jog sI) nhIN ho sikAw\u00a0[1[ rhwau\u00a0[","keI lokW ny jMglW ivc jw ky jog swDy, qp kIqy, gwjr-mUlI Awidk cux Kw ky guj\u00e6wrw kIqw;","jogI, krm-kWfI, \u2018Al`K\u2019 AwKx vwly jogI, monDwrI\u2014ieh swry jm dy lyKy ivc hI ilKy gey (Bwv, iehnW dy swDn mOq dy fr qoN bcw nhIN skdy)\u00a0[2[","ijs mnu`K ny srIr au`qy qW (Dwrimk icMnH) c`kr Awidk lw ley hn, pr pyRmw-BgqI aus dy ihrdy ivc pYdw nhIN hoeI, jo rwg rwgnIAW qW gwauNdw hY pr inrw pKMf-mUrqI hI bx bYTw hY, Aijhy mnu`K nMU prmwqmw pwsoN kuJ nhIN imldw\u00a0[3[","swry jgq au`qy kwl dw sihm ipAw hoieAw hY, BrmI ig
